<label [attr.for]="id">
  <span>{{ label }}</span>
  <select 
    [id]="id" 
    [disabled]="disabled" 
    [required]="required"
    [class]="'base-select--' + state"
    (change)="baseChange.emit($any($event.target).value)">
    @for (option of options; track option.value) {
      <option [value]="option.value" [selected]="option.value === value" [disabled]="option.disabled">
        {{ option.label }}
      </option>
    }
  </select>
  @if (helperText) {
    <small class="base-helper-text" [class]="'base-helper-text--' + state">{{ helperText }}</small>
  }
</label>

@if (open) { <div class="base-modal-backdrop" (click)="$event.target === $event.currentTarget && baseClose.emit()"><section class="base-modal" role="dialog" aria-modal="true" aria-labelledby="base-modal-title"><header><h2 id="base-modal-title">{{heading}}</h2><button type="button" aria-label="Fechar" (click)="baseClose.emit()">×</button></header>@if (body) { <p>{{body}}</p> }<ng-content />@if (primaryButton || secondaryButton) { <footer>@if (secondaryButton) { <button type="button" (click)="eventoSecundaryButton.emit()">{{secondaryButton}}</button> } @if (primaryButton) { <button type="button" (click)="eventoPrimaryButton.emit()">{{primaryButton}}</button> }</footer> }</section></div> }

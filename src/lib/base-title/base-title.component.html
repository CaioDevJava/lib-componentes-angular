@switch (level) {
  @case ('h1') { <h1 [class]="'base-title base-title--' + variant">{{ text }}<ng-content /></h1> }
  @case ('h2') { <h2 [class]="'base-title base-title--' + variant">{{ text }}<ng-content /></h2> }
  @case ('h3') { <h3 [class]="'base-title base-title--' + variant">{{ text }}<ng-content /></h3> }
  @case ('h4') { <h4 [class]="'base-title base-title--' + variant">{{ text }}<ng-content /></h4> }
  @case ('h5') { <h5 [class]="'base-title base-title--' + variant">{{ text }}<ng-content /></h5> }
  @default { <h6 [class]="'base-title base-title--' + variant">{{ text }}<ng-content /></h6> }
}
